<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EhliyetCepte 2026 - Çıkmış Sınav Soruları & Denemeler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 70px;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* HEADER */
    .top-header {
      background: #0284c7;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.25);
    }
    .brand-title { font-size: 19px; font-weight: 900; letter-spacing: -0.5px; }
    .brand-title span { color: #fde047; }
    .timer-badge {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: flex; align-items: center; gap: 6px;
    }

    /* CATEGORY TABS */
    .category-scroll {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid var(--border);
      background: #fff;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #0284c7;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }

    /* MAIN CONTENT */
    .exam-area { padding: 16px; flex: 1; }

    /* QUESTION CARD */
    .question-card {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 20px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .q-cat-tag { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #0284c7; background: #e0f2fe; padding: 4px 8px; border-radius: 6px; }
    .q-number { font-size: 12px; font-weight: 800; color: #64748b; }
    .q-text { font-size: 15px; font-weight: 700; color: #0f172a; line-height: 1.5; margin-bottom: 18px; }

    /* OPTIONS */
    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .option-item {
      display: flex;
      align-items: center;
      padding: 13px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      transition: all 0.2s;
      background: #fafafa;
    }
    .option-item:hover { border-color: #0284c7; background: #f0f9ff; }
    .option-item.selected {
      border-color: #0284c7;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 800;
    }
    .option-letter {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .option-item.selected .option-letter {
      background: #0284c7;
      color: #fff;
    }

    /* ACTION BUTTONS */
    .nav-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-nav {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-prev { background: #e2e8f0; color: #475569; }
    .btn-next { background: #0284c7; color: #fff; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35); }
    .btn-finish { background: #10b981; color: #fff; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35); }

    /* SCORE MODAL */
    .score-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .score-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 26px 22px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .score-icon { font-size: 48px; margin-bottom: 8px; }
    .score-badge { display: inline-block; padding: 6px 16px; border-radius: 9999px; font-weight: 800; font-size: 14px; margin-bottom: 14px; }
    .badge-passed { background: #dcfce7; color: #15803d; }
    .badge-failed { background: #fee2e2; color: #b91c1c; }
    .score-val { font-size: 38px; font-weight: 900; color: #0f172a; margin-bottom: 4px; }
    .score-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 16px 0;
      background: #f8fafc;
      padding: 12px;
      border-radius: 12px;
    }
    .stat-label { font-size: 11px; font-weight: 700; color: #64748b; }
    .stat-val { font-size: 16px; font-weight: 900; }

    /* ADMOB BANNER */
    .admob-banner {
      width: 100%;
      height: 50px;
      background: #f1f5f9;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      bottom: 0;
      z-index: 30;
    }
  </style>
</head>
<body>

<div class="app-screen">
  <!-- TOP HEADER -->
  <header class="top-header">
    <div>
      <div class="brand-title">Ehliyet<span>Cepte</span></div>
      <div style="font-size: 10px; color: #e0f2fe; font-weight: 600;">2026 Çıkmış Sınav Soruları</div>
    </div>
    <div class="timer-badge">
      ⏱️ <span id="timerText">45:00</span>
    </div>
  </header>

  <!-- CATEGORY TABS -->
  <div class="category-scroll">
    <button class="cat-btn active" onclick="switchCategory('all', this)">🏆 Deneme Sınavı</button>
    <button class="cat-btn" onclick="switchCategory('ilkyardim', this)">🩹 İlk Yardım</button>
    <button class="cat-btn" onclick="switchCategory('trafik', this)">🚦 Trafik</button>
    <button class="cat-btn" onclick="switchCategory('motor', this)">⚙️ Motor</button>
    <button class="cat-btn" onclick="switchCategory('adab', this)">🤝 Trafik Adabı</button>
  </div>

  <!-- EXAM AREA -->
  <main class="exam-area">
    <div class="question-card" id="qCard">
      <div class="q-meta">
        <span class="q-cat-tag" id="qCatTag">Kategori</span>
        <span class="q-number" id="qIndex">Soru 1/10</span>
      </div>
      <div class="q-text" id="qText">Soru yükleniyor...</div>
      <div class="options-list" id="qOptions">
        <!-- Seçenekler A, B, C, D -->
      </div>
    </div>

    <!-- NAVIGATION -->
    <div class="nav-actions">
      <button class="btn-nav btn-prev" onclick="prevQuestion()">◀ Önceki</button>
      <button class="btn-nav btn-next" id="nextBtn" onclick="nextQuestion()">Sonraki ▶</button>
      <button class="btn-nav btn-finish" id="finishBtn" onclick="finishExam()" style="display:none;">🏁 Sınavı Bitir</button>
    </div>
  </main>

  <!-- ADMOB SMART BANNER -->
  <div class="admob-banner">
    <span style="font-size: 9px; background: #94a3b8; color: #fff; padding: 2px 5px; border-radius: 3px; font-weight: 800;">ADMOB REKLAM</span>
    <span style="font-size: 11px; font-weight: 700; color: #475569;">Google AdMob Akıllı Banner Alanı (320x50)</span>
    <span style="font-size: 10px; color: #10b981; font-weight:700;">● Aktif</span>
  </div>
</div>

<!-- RESULT MODAL -->
<div id="scoreModal" class="score-modal">
  <div class="score-card">
    <div class="score-icon" id="scoreIcon">🏆</div>
    <div class="score-badge" id="scoreBadge">BAŞARILI GEÇTİNİZ</div>
    <div class="score-val" id="scoreVal">80 Puan</div>
    <div style="font-size: 12px; color: #64748b;">(Geçme notu en az 70 puandır)</div>

    <div class="score-stats">
      <div>
        <div class="stat-label">Doğru</div>
        <div class="stat-val" style="color: #10b981;" id="statCorrect">8</div>
      </div>
      <div>
        <div class="stat-label">Yanlış</div>
        <div class="stat-val" style="color: #ef4444;" id="statWrong">2</div>
      </div>
      <div>
        <div class="stat-label">Boş</div>
        <div class="stat-val" style="color: #64748b;" id="statEmpty">0</div>
      </div>
    </div>

    <button class="btn-nav btn-finish" style="width: 100%; margin-bottom: 8px;" onclick="closeModalAndRestart()">
      🔄 Yeniden Sınav Çöz
    </button>
  </div>
</div>

<script>
  let questions = [];
  let currentIndex = 0;
  let userAnswers = {}; // { questionId: 'A' }
  let timerSeconds = 45 * 60;
  let timerInterval = null;

  const ALL_QUESTIONS = [{"id": 1, "category": "ilkyardim", "category_title": "İlk Yardım", "question": "Aşağıdakilerden hangisi kaza sonuçlarının ağırlaşmasını önlemek için olay yerinin değerlendirilmesi işlemini kapsar?", "options": {"A": "Koruma", "B": "Bildirme", "C": "Kurtarma", "D": "Tedavi etme"}, "answer": "A", "explanation": "İlk yardımın temel uygulamaları Koruma, Bildirme ve Kurtarma (KBK) şeklindedir. Olay yerinin güvenliğinin sağlanması 'Koruma' basamağıdır."}, {"id": 2, "category": "ilkyardim", "category_title": "İlk Yardım", "question": "Yetişkinlerde temel yaşam desteği uygulanırken yapılan kalp masajında göğüs kemiği kaç cm aşağı inecek şekilde baskı uygulanır?", "options": {"A": "2 cm", "B": "3 cm", "C": "5 cm", "D": "7 cm"}, "answer": "C", "explanation": "Yetişkinlerde ve çocuklarda göğüs kemiği 5 cm, bebeklerde ise 4 cm çökecek şekilde baskı uygulanır."}, {"id": 3, "category": "ilkyardim", "category_title": "İlk Yardım", "question": "Solunum yolu tam tıkanmış bir kazazedede aşağıdaki belirtilerden hangisi görülür?", "options": {"A": "Konuşabilir", "B": "Öksürebilir", "C": "Nefes alabilir", "D": "Ellerini boynuna götürür, acı çeker ve morarır"}, "answer": "D", "explanation": "Tam tıkanmada Heimlich manevrası uygulanır. Belirtisi konuşamama, nefes alamama, elleri boyna götürme ve morarmadır."}, {"id": 4, "category": "trafik", "category_title": "Trafik ve Çevre", "question": "Aksine bir işaret yoksa yerleşim yeri dışındaki şehirlerarası çift yönlü karayollarında otomobiller için azami hız sınırı saatte kaç kilometredir?", "options": {"A": "70 km/s", "B": "80 km/s", "C": "90 km/s", "D": "100 km/s"}, "answer": "C", "explanation": "Otomobiller için şehir içi 50, şehirlerarası çift yönlü yolda 90, bölünmüş yolda 110, otoyolda 130/140 km/s hız sınırıdır."}, {"id": 5, "category": "trafik", "category_title": "Trafik ve Çevre", "question": "Işıklı trafik işaret cihazında yanan hangi ışık, ikaz mahiyetinde olup sırasıyla kırmızı ışığın yanacağını bildirir?", "options": {"A": "Yeşille birlikte yanan sarı ışık", "B": "Sarıdan sonra yanan yeşil ışık", "C": "Fasılalı yanan sarı ışık", "D": "Fasılalı yanan kırmızı ışık"}, "answer": "A", "explanation": "Yeşilden sonra yanan sarı ışık durulması gerektiğini ve kırmızı ışığın geleceğini bildirir."}, {"id": 6, "category": "trafik", "category_title": "Trafik ve Çevre", "question": "Şekildeki trafik işareti aşağıdakilerden hangisini bildirir?", "question_detail": "(Kırmızı üçgen içinde siyah iki eğri dalga)", "options": {"A": "Yolun kaygan olduğunu", "B": "Tehlikeli viraj olduğunu", "C": "Kasisli yol olduğunu", "D": "Yolda çalışma olduğunu"}, "answer": "C", "explanation": "Bu işaret kasisli yol kaplamasını bildirir; hız azaltılmalıdır."}, {"id": 7, "category": "motor", "category_title": "Motor ve Araç Tekniği", "question": "Seyir halindeyken gösterge panelinde yağ lambası yandığında sürücünün yapması gereken doğru hareket hangisidir?", "options": {"A": "Hızı artırmak", "B": "Yola aynı hızla devam etmek", "C": "Aracı derhal durdurup kontağı kapatmak", "D": "Far ve sinyalleri yakmak"}, "answer": "C", "explanation": "Motor yağ lambası veya hararet lambası yandığında araç derhal güvenli bir yerde durdurulmalı ve kontak kapatılmalıdır."}, {"id": 8, "category": "motor", "category_title": "Motor ve Araç Tekniği", "question": "Aşağıdakilerden hangisi motorun hararet yapmasına (aşırı ısınmasına) sebep olur?", "options": {"A": "Radyatör hortumlarında sızıntı olması ve suyun azalması", "B": "Lastik hava basıncının yüksek olması", "C": "Fren hidroliğinin fazla olması", "D": "Akü kutup başlarının gevşemesi"}, "answer": "A", "explanation": "Soğutma suyunun azalması, vantilatör kayışının kopması veya termostat arızası motorun hararet yapmasına yol açar."}, {"id": 9, "category": "adab", "category_title": "Trafik Adabı", "question": "Yağmurlu bir günde araç sürerken kaldırımdaki yayalara su sıçratmamak için özen gösterilmesi hangi trafik adabı değerini gösterir?", "options": {"A": "İnatlaşma", "B": "Saygı ve Nezaket", "C": "Sabırsızlık", "D": "Bencillik"}, "answer": "B", "explanation": "Diğer yol kullanıcılarına ve yayalara zarar vermemek, saygı, empati ve nezaket göstergesidir."}, {"id": 10, "category": "adab", "category_title": "Trafik Adabı", "question": "Trafikte kırmızı ışıkta beklerken yeşil ışık yanar yanmaz arkadaki sürücünün hemen kornaya basması neyin eksikliğini gösterir?", "options": {"A": "Sabır", "B": "Öfke", "C": "Cesaret", "D": "İnatçılık"}, "answer": "A", "explanation": "Yeşil ışık yanar yanmaz sabırsızca kornaya basmak sabır ve hoşgörü eksikliğidir."}];
  function loadQuestions(category = 'all') {
    if (category === 'all') {
      questions = ALL_QUESTIONS;
    } else {
      questions = ALL_QUESTIONS.filter(q => q.category === category);
    }
    currentIndex = 0;
    userAnswers = {};
    renderCurrentQuestion();
    startTimer();
  }

  function renderCurrentQuestion() {
    if (questions.length === 0) return;
    const q = questions[currentIndex];

    document.getElementById('qCatTag').innerText = q.category_title;
    document.getElementById('qIndex').innerText = `Soru ${currentIndex + 1}/${questions.length}`;
    document.getElementById('qText').innerText = q.question;

    const optContainer = document.getElementById('qOptions');
    optContainer.innerHTML = '';

    const letters = ['A', 'B', 'C', 'D'];
    letters.forEach(letter => {
      const isSelected = userAnswers[q.id] === letter;
      const optDiv = document.createElement('div');
      optDiv.className = 'option-item' + (isSelected ? ' selected' : '');
      optDiv.onclick = () => selectOption(q.id, letter);

      optDiv.innerHTML = `
        <div class="option-letter">${letter}</div>
        <div>${q.options[letter]}</div>
      `;
      optContainer.appendChild(optDiv);
    });

    document.getElementById('nextBtn').style.display = currentIndex < questions.length - 1 ? 'flex' : 'none';
    document.getElementById('finishBtn').style.display = currentIndex === questions.length - 1 ? 'flex' : 'none';
  }

  function selectOption(qId, letter) {
    userAnswers[qId] = letter;
    renderCurrentQuestion();
  }

  function prevQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      renderCurrentQuestion();
    }
  }

  function nextQuestion() {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderCurrentQuestion();
    }
  }

  function finishExam() {
    // AdMob Geçiş Reklamı (Interstitial) simülasyonu
    alert('🎬 Google AdMob Geçiş Reklamı Gösteriliyor...\n(Kullanıcı sınavı bitirdiği an tam ekran reklam gösterilir ve gelir hanenize yazılır).');

    let correct = 0;
    let wrong = 0;
    let empty = 0;

    questions.forEach(q => {
      const userAns = userAnswers[q.id];
      if (!userAns) empty++;
      else if (userAns === q.answer) correct++;
      else wrong++;
    });

    const score = Math.round((correct / questions.length) * 100);
    const passed = score >= 70;

    document.getElementById('scoreVal').innerText = score + ' Puan';
    document.getElementById('statCorrect').innerText = correct;
    document.getElementById('statWrong').innerText = wrong;
    document.getElementById('statEmpty').innerText = empty;

    const badge = document.getElementById('scoreBadge');
    const icon = document.getElementById('scoreIcon');
    if (passed) {
      badge.className = 'score-badge badge-passed';
      badge.innerText = '✅ TEBRİKLER! SINAVI GEÇTİNİZ';
      icon.innerText = '🎉';
    } else {
      badge.className = 'score-badge badge-failed';
      badge.innerText = '❌ MAALESEF KALDINIZ (70 PUAN GEREKLİ)';
      icon.innerText = '📚';
    }

    document.getElementById('scoreModal').style.display = 'flex';
  }

  function closeModalAndRestart() {
    document.getElementById('scoreModal').style.display = 'none';
    loadQuestions('all');
  }

  function switchCategory(cat, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadQuestions(cat);
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerSeconds = 45 * 60;
    timerInterval = setInterval(() => {
      timerSeconds--;
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        finishExam();
        return;
      }
      const m = Math.floor(timerSeconds / 60);
      const s = timerSeconds % 60;
      document.getElementById('timerText').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }, 1000);
  }

  loadQuestions('all');
</script>
</body>
</html>
